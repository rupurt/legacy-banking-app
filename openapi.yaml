openapi: 3.0.3
info:
  title: Banking CIF API
  description: RESTful API for Customer Information File (CIF) management.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /customers:
    get:
      summary: List all customers
      responses:
        '200':
          description: A list of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '201':
          description: Customer created
        '400':
          description: Invalid input or email already exists
  /customers/{id}:
    get:
      summary: Get customer by ID or Name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
  /accounts:
    post:
      summary: Open a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '201':
          description: Account created
        '400':
          description: Invalid input
  /accounts/{id}:
    get:
      summary: Get account details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found
    put:
      summary: Update account status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Account updated
  /transactions:
    post:
      summary: Process a financial transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '201':
          description: Transaction completed
        '400':
          description: Invalid transaction (e.g. negative amount, insufficient funds)
  /transactions/{accountId}:
    get:
      summary: List transactions for an account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

components:
  schemas:
    Customer:
      type: object
      properties:
        customerId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        cifNumber:
          type: string
        dateOfBirth:
          type: string
        kycStatus:
          type: string
        riskRating:
          type: string
        accountCount:
          type: integer
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    Account:
      type: object
      properties:
        accountId:
          type: integer
        customerId:
          type: integer
        productCode:
          type: string
        accountNumber:
          type: string
        balance:
          type: number
        status:
          type: string
    Transaction:
      type: object
      properties:
        transactionId:
          type: integer
        accountId:
          type: integer
        transactionType:
          type: string
        amount:
          type: number
        transactionDate:
          type: string
          format: date-time
        balanceAfter:
          type: number
